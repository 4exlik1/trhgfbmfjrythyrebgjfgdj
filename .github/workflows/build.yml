name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle не найден в репозитории. Файлы:"
            find . -not -path './.git/*' -type f
            exit 1
          fi
          cd "$(dirname "$f")"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: teamwars-jar
          path: "**/build/libs/teamwars-*.jar"
